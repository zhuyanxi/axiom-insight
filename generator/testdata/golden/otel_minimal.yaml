    name: POST /orders/{id}
    kind: server
    target:
      type: endpoint
      id: ep:orders
    lifecycle:
      start: operation_start
      end: operation_end
    parent:
      strategy: extract_or_root
      carrier: http_headers
    attributes:
      - key: http.request.method
        type: string
        binding:
          source: constant
          string: POST
          type: string
    status:
      mapping:
        cancelled: error
        error: error
        ok: unset
        timeout: error
        unknown: unset
    events:
      - id: tracing:ep:orders:root:exception
        name: exception
        statuses:
          - error
