name: phase2-quality

# Phase 2 required check (P2-14): Dashboard contract, safety, determinism,
# compatibility, race, offline, and performance gates must all pass.
# Dashboard gates are offline (no protoc/protobuf regeneration is needed).
on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26.1"

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Ensure GNU make (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: command -v make >/dev/null 2>&1 || choco install make -y
      - name: Phase 2 quality gates
        shell: bash
        run: make phase2-quality
      - name: Cross-platform canonical output evidence
        shell: bash
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
        run: go test ./dashboard/pipeline -run 'TestP214CanonicalOutput' -count=1 -v
