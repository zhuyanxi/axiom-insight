name: phase2-quality

# Phase 2 required check (P2-14): Dashboard contract, safety, determinism,
# compatibility, race, offline, and performance gates must all pass.
on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26.1"
  PROTOC_GEN_GO_VERSION: "v1.36.6"
  PROTOC_GEN_GO_GRPC_VERSION: "v1.5.1"

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install pinned Go protobuf generators
        shell: bash
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${{ env.PROTOC_GEN_GO_VERSION }}
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@${{ env.PROTOC_GEN_GO_GRPC_VERSION }}
      - name: Install pinned Protocol Buffers compiler
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) URL="https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip" ;;
            macOS) URL="https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-osx-universal_binary.zip" ;;
            Windows) URL="https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip" ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" "$URL"
          mkdir -p "$RUNNER_TEMP/protoc"
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Expand-Archive -LiteralPath '$RUNNER_TEMP/protoc.zip' -DestinationPath '$RUNNER_TEMP/protoc' -Force"
          else
            unzip -o "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          fi
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Phase 2 quality gates
        shell: bash
        run: make phase2-quality
      - name: Cross-platform canonical output evidence
        shell: bash
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
        run: go test ./dashboard/pipeline -run 'TestP214CanonicalOutput' -count=1 -v