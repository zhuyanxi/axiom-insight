name: quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-0-quality:
    name: Phase 0 quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned Protocol Buffers compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local

      - name: Install Protocol Buffers generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      - name: Run tests
        run: go test ./...

      - name: Run fixture E2E tests
        run: go test ./cmd/si-cli -run TestScanFixtures -count=1

      - name: Run vet
        run: go vet ./...

      - name: Run race detector
        run: go test -race ./compiler/goanalyzer ./plugins ./cmd/si-cli

      - name: Check generated Protocol Buffers
        run: make check-generated

      - name: Check performance budget and benchmark
        run: make perf
